<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#141414">
    <title>GABIBYTE ESTÁ CANCELADO</title>
    <link rel="icon" href="resources/favicon.ico">
    <link rel="stylesheet" href="resources/styles.css">
  </head>
  <body>
    <main>
      <h1 aria-label="GABIBYTE ESTÁ CANCELADO">
        <svg viewBox="0 -92.6 811.2 94" aria-hidden="true" focusable="false">
          <text font-size="100">GABIBYTE ESTÁ</text>
        </svg>
        <svg viewBox="0 -72.8 638.8 74.2" aria-hidden="true" focusable="false">
          <text font-size="100" class="accent">CANCELADO</text>
        </svg>
      </h1>
      <p>Por el momento. Algún día abriré.</p>
    </main>
    <script>
      // Fit each line to the font actually available on this device.
      const context = document.createElement('canvas').getContext('2d');
      for (const line of document.querySelectorAll("h1 svg")) {
        const width = line.querySelector("text").getComputedTextLength();
        if (width > 0) line.viewBox.baseVal.width = width;
        if (context) {
          const text = line.querySelector("text");
          const style = getComputedStyle(text);
          context.font = style.fontWeight + " " + style.fontSize + " " + style.fontFamily;
          const bounds = context.measureText(text.textContent);
          const box = line.viewBox.baseVal;
          box.y = -bounds.actualBoundingBoxAscent;
          box.height = bounds.actualBoundingBoxAscent + bounds.actualBoundingBoxDescent;
        }
      }
    </script>
  </body>
</html>
